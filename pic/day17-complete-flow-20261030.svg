<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2180" viewBox="0 0 2000 2180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#178078"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77823"/></marker></defs><rect width="2000" height="2180" fill="#f5f9fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="80" y="68" font-size="45" fill="#17343c" font-weight="750" text-anchor="start">Mini-Pi：从一条新消息，到回答、摘要与恢复</text><text x="80" y="113" font-size="28" fill="#55717a" font-weight="400" text-anchor="start">入口：Harness → Agent → run_loop 已转交摘要配置，摘要后请求已恢复</text><path d="M84 154H160" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="178" y="163" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">已接通</text><rect x="340" y="139" width="37" height="27" rx="6" fill="white" stroke="#3876aa" stroke-width="2.5"/><text x="391" y="163" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">功能已实现，自动调用待接</text><path d="M850 154H930" fill="none" stroke="#c77823" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#p)"/><text x="948" y="163" font-size="25" fill="#c77823" font-weight="400" text-anchor="start">待接通</text><text x="1510" y="163" font-size="24" fill="#55717a" font-weight="400" text-anchor="start">核对日期：2026-10-30</text><rect x="80" y="205" width="1840" height="135" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="102" y="247" font-size="29" fill="#178078" font-weight="650" text-anchor="start">原始历史 + SessionStore：完整保留</text><text x="102" y="287" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">新用户消息、模型输出、完整工具结果，都按实际发生的顺序记录。</text><text x="102" y="321" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">摘要作为独立记录保存；原消息仍然保留。参考资料只供本次请求使用。</text><rect x="80" y="455" width="550" height="1165" rx="24" fill="#eaf2f4" stroke="#c9dbdf" stroke-width="1.5"/><text x="104" y="498" font-size="31" fill="#17343c" font-weight="700" text-anchor="start">1. 每次请求先准备内容</text><rect x="710" y="455" width="610" height="1165" rx="24" fill="#eaf2f4" stroke="#c9dbdf" stroke-width="1.5"/><text x="734" y="498" font-size="31" fill="#17343c" font-weight="700" text-anchor="start">2. 超过阈值，插入摘要流程</text><rect x="1400" y="455" width="520" height="1165" rx="24" fill="#eaf2f4" stroke="#c9dbdf" stroke-width="1.5"/><text x="1424" y="498" font-size="31" fill="#17343c" font-weight="700" text-anchor="start">3. 调用回答模型</text><rect x="105" y="530" width="500" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="572" font-size="29" fill="#178078" font-weight="650" text-anchor="start">取本轮模型请求视图</text><text x="127" y="612" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">没有摘要：原始历史</text><text x="127" y="646" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">有摘要：摘要 + 近期及新增消息</text><rect x="105" y="705" width="500" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="747" font-size="29" fill="#178078" font-weight="650" text-anchor="start">D16：截短长文件结果</text><text x="127" y="787" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">只处理成功的 read_file 结果副本</text><text x="127" y="821" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">原始历史中的完整结果不变</text><rect x="105" y="880" width="500" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="922" font-size="29" fill="#178078" font-weight="650" text-anchor="start">加入本次参考资料（若有）</text><text x="127" y="962" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">来自检索；不进入历史摘要</text><text x="127" y="996" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">没有参考资料也继续后面的预算</text><rect x="105" y="1055" width="500" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="1097" font-size="29" fill="#178078" font-weight="650" text-anchor="start">估算完整请求占用</text><text x="127" y="1137" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">模型消息 + 参考资料 + 工具定义</text><text x="127" y="1171" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">为模型输出和安全余量留空间</text><rect x="105" y="1230" width="500" height="105" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="1272" font-size="29" fill="#178078" font-weight="650" text-anchor="start">是否超过摘要触发点？</text><text x="127" y="1312" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">启用自动摘要时，在这里判断</text><path d="M355 340V430H90V595H105" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M355 660V705" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M355 835V880" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M355 1010V1055" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M355 1185V1230" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="115" y="1400" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">本次参考资料从这里加入请求。</text><text x="115" y="1440" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">D17 不压缩这些参考资料。</text><text x="115" y="1510" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">工具结果返回后，也要重新走完</text><text x="115" y="1550" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">这条准备流程，再调用回答模型。</text><rect x="735" y="530" width="560" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="572" font-size="28" fill="#178078" font-weight="650" text-anchor="start">回到原始历史，选择切分位置</text><text x="757" y="612" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">系统消息保留；其余分成旧内容、近期内容</text><text x="757" y="646" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">一组工具调用及其结果，不能拆开</text><rect x="735" y="705" width="265" height="110" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="747" font-size="29" fill="#178078" font-weight="650" text-anchor="start">旧内容</text><text x="757" y="787" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">需要压缩的部分</text><rect x="1030" y="705" width="265" height="110" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1052" y="747" font-size="29" fill="#178078" font-weight="650" text-anchor="start">近期内容</text><text x="1052" y="787" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">保留原文</text><rect x="735" y="860" width="265" height="110" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="902" font-size="28" fill="#178078" font-weight="650" text-anchor="start">调用摘要模型</text><text x="757" y="942" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">输入：旧内容</text><rect x="735" y="1025" width="560" height="155" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="1067" font-size="29" fill="#178078" font-weight="650" text-anchor="start">组成候选模型请求</text><text x="757" y="1107" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">系统消息 + 摘要 + 近期内容</text><text x="757" y="1141" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">再走 D16、加参考资料、检查完整预算</text><rect x="735" y="1215" width="560" height="85" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="1257" font-size="27" fill="#178078" font-weight="650" text-anchor="start">候选摘要已生成</text><rect x="735" y="1340" width="560" height="110" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="1382" font-size="25" fill="#178078" font-weight="650" text-anchor="start">保存摘要并读回会话</text><text x="757" y="1422" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">摘要及会话编号、压缩范围、历史指纹</text><rect x="735" y="1490" width="560" height="105" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="757" y="1532" font-size="26" fill="#178078" font-weight="650" text-anchor="start">接上 steering，重新准备请求</text><text x="757" y="1572" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">有新消息时重新准备参考资料</text><path d="M1015 340V430H1305V515H1015V530" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M605 1282H672V595H735" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="635" y="1256" font-size="27" fill="#17343c" font-weight="400" text-anchor="start">是</text><path d="M870 660V705" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1162 660V705" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M867 815V860" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M867 970V1025" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1162 815V1025" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1015 1180V1215" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1015 1300V1340" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1015 1450V1490" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M735 1395H695V340" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="722" y="1320" font-size="23" fill="#3876aa" font-weight="400" text-anchor="start">保存已接入，完整流程待验证</text><rect x="1425" y="530" width="470" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1447" y="572" font-size="27" fill="#178078" font-weight="650" text-anchor="start">send_prepared：发送前检查</text><text x="1447" y="612" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">完整预算、字符限制（若配置）</text><text x="1447" y="646" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">工具配对、取消和总时限</text><rect x="1425" y="705" width="470" height="130" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1447" y="747" font-size="27" fill="#178078" font-weight="650" text-anchor="start">generate：回答模型生成</text><text x="1447" y="787" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">输入：刚才准备好的完整请求</text><text x="1447" y="821" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">输出：直接回答，或提出工具调用</text><path d="M605 1282H650V395H1660V530" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="665" y="385" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">否 / 未启用自动摘要：进入发送前检查</text><path d="M1295 1542H1360V595H1425" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1660 660V705" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><rect x="1425" y="920" width="220" height="120" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1447" y="962" font-size="28" fill="#178078" font-weight="650" text-anchor="start">直接回答</text><text x="1447" y="1002" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">记录并结束</text><rect x="1675" y="920" width="220" height="120" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1697" y="962" font-size="28" fill="#178078" font-weight="650" text-anchor="start">工具调用</text><text x="1697" y="1002" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">记录模型输出</text><path d="M1540 835V920" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1785 835V920" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><rect x="1675" y="1090" width="220" height="100" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1697" y="1132" font-size="28" fill="#178078" font-weight="650" text-anchor="start">执行工具</text><rect x="1675" y="1240" width="220" height="145" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1697" y="1282" font-size="26" fill="#178078" font-weight="650" text-anchor="start">保存完整结果</text><text x="1697" y="1322" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">写回原始历史</text><text x="1697" y="1356" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">再准备下一轮</text><path d="M1785 1040V1090" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1785 1190V1240" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1895 1310H1950V275H1920" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="1930" y="1145" font-size="25" fill="#178078" font-weight="400" text-anchor="start">回</text><text x="1930" y="1180" font-size="25" fill="#178078" font-weight="400" text-anchor="start">到</text><text x="1930" y="1215" font-size="25" fill="#178078" font-weight="400" text-anchor="start">原</text><text x="1930" y="1250" font-size="25" fill="#178078" font-weight="400" text-anchor="start">始</text><text x="1930" y="1285" font-size="25" fill="#178078" font-weight="400" text-anchor="start">历</text><text x="1930" y="1320" font-size="25" fill="#178078" font-weight="400" text-anchor="start">史</text><text x="1430" y="1455" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">摘要模型负责压缩旧内容。</text><text x="1430" y="1495" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">回答模型负责继续当前任务。</text><text x="1430" y="1550" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">两次调用的输入和目的不同。</text><rect x="80" y="1700" width="1840" height="290" rx="24" fill="#eaf2f4" stroke="#c9dbdf" stroke-width="1.5"/><text x="104" y="1743" font-size="31" fill="#17343c" font-weight="700" text-anchor="start">4. 重新打开会话：读取已经保存的摘要（这条路径已接通）</text><rect x="105" y="1790" width="350" height="145" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="127" y="1832" font-size="29" fill="#178078" font-weight="650" text-anchor="start">重新打开会话</text><text x="127" y="1872" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">读取原始历史</text><text x="127" y="1906" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">以及摘要记录</text><rect x="505" y="1790" width="380" height="145" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="527" y="1832" font-size="26" fill="#178078" font-weight="650" text-anchor="start">检查摘要能否用于此会话</text><text x="527" y="1872" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">会话编号、范围、历史指纹</text><text x="527" y="1906" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">先处理未结束的工具调用</text><rect x="935" y="1790" width="390" height="145" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="957" y="1832" font-size="27" fill="#178078" font-weight="650" text-anchor="start">构造模型请求视图</text><text x="957" y="1872" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">系统消息 + 摘要 + 近期消息</text><text x="957" y="1906" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">+ 摘要保存后新增的消息</text><rect x="1375" y="1790" width="520" height="145" rx="18" fill="#ffffff" stroke="#178078" stroke-width="2.5" /><text x="1397" y="1832" font-size="27" fill="#178078" font-weight="650" text-anchor="start">回到左侧第一步，继续准备请求</text><text x="1397" y="1872" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">原始历史仍保留全量消息</text><text x="1397" y="1906" font-size="25" fill="#17343c" font-weight="400" text-anchor="start">当前消息的参考资料随后单独加入</text><path d="M80 275H35V1862H105" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M455 1862H505" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M885 1862H935" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1325 1862H1375" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><path d="M1635 1790V1675H55V430H90V595H105" fill="none" stroke="#178078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#a)"/><text x="80" y="2050" font-size="27" fill="#c77823" font-weight="650" text-anchor="start">当前进度：Harness 恢复会话触发摘要并继续回答的模拟验证通过；CLI 默认未启用。</text><text x="80" y="2100" font-size="26" fill="#55717a" font-weight="400" text-anchor="start">本阶段只支持首次摘要。图中实线表示已连接；蓝框表示组件已有，橙色虚线表示自动流程待连接。</text></g></svg>